<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3942">
<title>Three Lakes · Lon's Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@600;700&family=Libre+Baskerville:wght@400&family=Courier+Prime:wght@700&display=swap">
<style>
/* Lon's phone at the podium: the slide order, with the slide that's up now lit in gold. */
:root {
  color-scheme: dark;
  --lake: #0F3942;
  --lake-deep: #0B2C33;
  --cream: #F6F1E4;
  --mist: #B9CDCF;
  --dim: #6F8F93;
  --gold: #FAA512;
  --ink: #141414;
}
* { box-sizing: border-box; }
html { background: var(--lake); }
body { margin: 0; background: var(--lake); color: var(--cream); font-family: 'Libre Baskerville', Baskerville, Georgia, serif; font-size: 19px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
header { position: sticky; top: 0; z-index: 2; background: var(--lake-deep); padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: 'Rye', Georgia, serif; font-weight: 400; font-size: 21px; margin: 0; color: var(--cream); }
.live { display: flex; align-items: center; gap: 8px; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.live i { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); display: block; }
.live.on { color: var(--gold); }
.live.on i { background: var(--gold); box-shadow: 0 0 0 0 rgba(250,165,18,.7); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(250,165,18,.6); } 70% { box-shadow: 0 0 0 10px rgba(250,165,18,0); } 100% { box-shadow: 0 0 0 0 rgba(250,165,18,0); } }
@media (prefers-reduced-motion: reduce) { .live.on i { animation: none; } }
header .now { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
header .now .lbl { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
header .now .title { font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--cream); text-wrap: balance; }
header .now .next { font-size: 16px; color: var(--mist); }
main { padding: 10px 18px calc(40px + env(safe-area-inset-bottom, 0px)); }
h2 { font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin: 22px 0 6px; }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 9px 10px; border-radius: 10px; color: var(--cream); transition: background .3s ease, color .3s ease; }
li .n { font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-weight: 700; font-size: 16px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
li.past { color: var(--dim); }
li.now { background: var(--gold); color: var(--ink); }
li.now .n { color: var(--ink); }
li.clip .t { font-style: italic; }
.foot { margin-top: 26px; font-size: 14px; color: var(--dim); }
.timer { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 12px; background: rgba(246,241,228,.07); }
.timer .clock { font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1; color: var(--cream); font-variant-numeric: tabular-nums; min-width: 96px; }
.timer .note { flex: 1; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.timer button { font: 700 15px/1 'Courier Prime', monospace; letter-spacing: .06em; border-radius: 999px; padding: 11px 16px; cursor: pointer; border: 0; }
.timer #tGo { background: var(--gold); color: var(--ink); }
.timer #tReset { background: transparent; color: var(--mist); border: 1px solid rgba(246,241,228,.25); padding: 10px 12px; }
.timer.running .clock { color: var(--gold); }
.timer.low { background: rgba(250,165,18,.18); }
.timer.done { background: var(--gold); }
.timer.done .clock, .timer.done .note { color: var(--ink); }
.timer.done #tReset { color: var(--ink); border-color: rgba(20,20,20,.35); }
.timer button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Three Lakes</h1><div class="live" id="live"><i></i><span id="liveText">Connecting</span></div></div>
  <div class="timer" id="timer">
    <span class="clock" id="tClock" role="timer" aria-live="off">45:00</span>
    <span class="note" id="tNote">45-minute talk</span>
    <button type="button" id="tGo">Start</button>
    <button type="button" id="tReset" aria-label="Reset the timer to 45 minutes">Reset</button>
  </div>
  <div class="now" aria-live="polite">
    <div class="lbl" id="nowLbl">Up now</div>
    <div class="title" id="nowTitle">Title</div>
    <div class="next" id="nextTitle"></div>
  </div>
</header>
<main id="list"></main>

<script src="slides.js"></script>
<script>
const list = document.getElementById('list');
let html = '', open = false;
S.forEach((s, i) => {
  if (s.grp || i === 0) {
    if (open) html += '</ol>';
    if (s.grp) html += `<h2>${s.grp}</h2>`;
    html += '<ol>'; open = true;
  }
  html += `<li id="s${i + 1}" class="${s.t === 'video' ? 'clip' : ''}"><span class="n">${i + 1}</span><span class="t"></span></li>`;
});
list.innerHTML = html + '</ol><p class="foot">This page follows the slideshow on its own. Keep it open.</p>';
S.forEach((s, i) => { document.querySelector(`#s${i + 1} .t`).textContent = cueTitle(s); });

let current = 0;
function show(n, fromLive) {
  n = parseInt(n, 10);
  if (!(n >= 1 && n <= S.length)) return;
  current = n;
  S.forEach((s, i) => {
    const li = document.getElementById('s' + (i + 1));
    li.classList.toggle('now', i + 1 === n);
    li.classList.toggle('past', i + 1 < n);
  });
  document.getElementById('nowLbl').textContent = `Up now · ${n} of ${S.length}`;
  document.getElementById('nowTitle').textContent = cueTitle(S[n - 1]);
  document.getElementById('nextTitle').textContent = n < S.length ? `Next: ${cueTitle(S[n])}` : 'Last slide';
  const li = document.getElementById('s' + n);
  const y = li.getBoundingClientRect().top + scrollY - document.querySelector('header').offsetHeight - 70;
  scrollTo({ top: Math.max(0, y), behavior: fromLive ? 'smooth' : 'auto' });
}
show(1);

const live = document.getElementById('live'), liveText = document.getElementById('liveText');
function setLive(on) { live.classList.toggle('on', on); liveText.textContent = on ? 'Live' : 'Connecting'; }

const BASE = `https://ntfy.sh/${new URLSearchParams(location.search).get('topic') || LIVE_TOPIC}`;
function slideOf(text) { try { const d = JSON.parse(text); return typeof d === 'number' ? d : d && d.s; } catch (e) { return parseInt(text, 10); } }
async function catchUp() {
  try {
    const r = await fetch(`${BASE}/json?poll=1&since=12h`, { cache: 'no-store' });
    const lines = (await r.text()).trim().split('\n').filter(Boolean);
    let last = null;
    for (const line of lines) { try { const m = JSON.parse(line); if (m.event === 'message') last = m; } catch (e) {} }
    if (last && slideOf(last.message) !== current) show(slideOf(last.message), true);
  } catch (e) {}
}
function listen() {
  const es = new EventSource(`${BASE}/sse`);
  es.onopen = () => { setLive(true); catchUp(); };
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message') show(slideOf(m.message), true); } catch (err) {} };
  es.onerror = () => setLive(false);
}
catchUp(); listen();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { catchUp(); keepAwake(); } });

/* the 45-minute timer: counts from a saved start time, so it stays right if the phone sleeps or the page reloads */
const TALK = 45 * 60 * 1000, KEY = 'three-lakes-timer';
let tm = { start: null, pausedLeft: TALK };
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) tm = saved; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tm)); } catch (e) {} };
const left = () => tm.start ? tm.pausedLeft - (Date.now() - tm.start) : tm.pausedLeft;
function drawTimer() {
  const ms = left(), neg = ms < 0, sec = Math.ceil(Math.abs(ms) / 1000);
  const m = Math.floor(sec / 60), s2 = String(sec % 60).padStart(2, '0');
  document.getElementById('tClock').textContent = (neg ? '+' : '') + m + ':' + s2;
  const el = document.getElementById('timer');
  el.classList.toggle('running', !!tm.start);
  el.classList.toggle('low', ms > 0 && ms <= 5 * 60 * 1000);
  el.classList.toggle('done', ms <= 0);
  document.getElementById('tNote').textContent = ms <= 0 ? 'Time’s up' : tm.start ? (ms <= 5 * 60 * 1000 ? 'Five minutes left' : 'Running') : (ms < TALK ? 'Paused' : '45-minute talk');
  document.getElementById('tGo').textContent = tm.start ? 'Pause' : (ms < TALK ? 'Resume' : 'Start');
}
document.getElementById('tGo').addEventListener('click', () => {
  if (tm.start) { tm.pausedLeft = left(); tm.start = null; } else { tm.start = Date.now(); }
  save(); drawTimer(); keepAwake();
});
document.getElementById('tReset').addEventListener('click', () => { tm = { start: null, pausedLeft: TALK }; save(); drawTimer(); });
drawTimer(); setInterval(drawTimer, 500);

/* keep the phone's screen on while this page is open, where the phone allows it */
let lock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {} }
keepAwake();
document.addEventListener('click', keepAwake);
</script>
</body>
</html>
